# Compila una app de ArtCraft con la marca Jacnex para Windows (x64) y, si se pide, la publica
# como versión (release) en el repositorio que llama a este flujo.
# Lo usan los repositorios de cada app: jacnexstudio/jacnex-studio, jacnexstudio/photocraft, ...

name: Compilar para Windows

on:
  workflow_call:
    inputs:
      proyecto:
        description: "Reglas de rebrand/reglas a usar (launcher, photocraft, ...)"
        type: string
        required: true
      upstream:
        description: "Repositorio original, p. ej. storytold/craft-launcher"
        type: string
        required: true
      nombre:
        description: "Nombre para mostrar, p. ej. Jacnex Studio"
        type: string
        required: true
      ref:
        description: "Versión original a compilar (etiqueta). Vacío: la última publicada."
        type: string
        default: ""
      version:
        description: "Versión de Jacnex (X.Y.Z) si no es la de ArtCraft. Vacío: la misma que ref."
        type: string
        default: ""
      publicar:
        description: "Publicar la versión en este repositorio"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      # Compilación rápida: ArtCraft compila con `codegen-units = 1` y LTO "thin", que en el
      # runner de 4 núcleos hacen que Photonex o Vectornex tarden 17-30 min aunque la caché
      # acierte. Con 16 unidades y sin LTO entre crates tarda varias veces menos; el programa
      # queda algo más grande y unos puntos más lento. Van a nivel de job (no del paso) para que
      # entren en la clave de rust-cache y la caché guarde las dependencias ya compiladas así.
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      CARGO_PROFILE_RELEASE_LTO: "false"
    steps:
      - name: Elegir la versión original
        id: version
        shell: pwsh
        run: |
          $ref = '${{ inputs.ref }}'
          if (-not $ref) { $ref = gh release view --repo '${{ inputs.upstream }}' --json tagName --jq .tagName }
          if (-not $ref) { throw 'No se encontró ninguna versión publicada en ${{ inputs.upstream }}' }
          # La versión que publica Jacnex: la de ArtCraft, o una mayor si se vuelve a compilar con
          # cambios de Jacnex (la calcula actualizar.yml).
          $version = '${{ inputs.version }}'
          if (-not $version) { $version = $ref.TrimStart('v') }
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') { throw "Versión de Jacnex no válida: $version" }
          "ref=$ref" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
          Write-Output "Compilando ${{ inputs.upstream }} $ref como Jacnex v$version"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jacnexstudio/jacnex-build
          path: jb

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.upstream }}
          ref: ${{ steps.version.outputs.ref }}
          path: src

      - name: Cambio de marca
        run: python -B jb/rebrand/rebrand.py ${{ inputs.proyecto }} src

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src

      # Después de la caché: cambia la copia descargada de craft-update (actualizarse sin firma).
      - name: Ajustar bibliotecas de ArtCraft
        run: python -B jb/rebrand/bibliotecas.py src

      # Después de la caché, como el paso anterior: el número de versión no cambia su clave.
      - name: Versión de Jacnex
        if: steps.version.outputs.tag != steps.version.outputs.ref
        shell: pwsh
        working-directory: src
        run: |
          python -B ../jb/rebrand/version.py . '${{ steps.version.outputs.version }}'
          if ($LASTEXITCODE -ne 0) { throw 'No se pudo poner la versión' }
          # Solo las entradas de las crates del propio código en Cargo.lock (la compilación usa --locked).
          cargo update --workspace --offline
          if ($LASTEXITCODE -ne 0) {
            cargo update --workspace
            if ($LASTEXITCODE -ne 0) { throw 'cargo update --workspace falló' }
          }

      - name: Instalar WiX (instalador MSI)
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2 WixToolset.Util.wixext/5.0.2

      - name: Compilar y empaquetar
        shell: pwsh
        working-directory: src
        env:
          DIST: ${{ github.workspace }}/dist
        run: pwsh packaging/windows/package.ps1 -Arch x64

      # Guarda: Jacnex Studio 0.19.2 salió con la comprobación de firma de ArtCraft ("isn't signed
      # ... doesn't install updates") porque la caché trajo craft-update compilado sin el ajuste de
      # bibliotecas.py, y quien lo instaló no podía actualizarse. Nunca se publica un programa así.
      - name: Comprobar el ajuste de craft-update
        shell: pwsh
        working-directory: src/target/x86_64-pc-windows-msvc/release
        run: |
          $exes = @(Get-ChildItem -File -Filter *.exe)
          if (-not $exes) { throw 'No hay ningún .exe compilado' }
          foreach ($exe in $exes) {
            $texto = [IO.File]::ReadAllText($exe.FullName, [Text.Encoding]::GetEncoding(28591))
            if ($texto.Contains("so it doesn't install updates")) {
              throw "$($exe.Name) tiene craft-update sin ajustar: no se actualizaría sin firma digital"
            }
            Write-Output "$($exe.Name): craft-update ajustado"
          }

      # Jacnex Studio instala las apps desde su zip portable y busca el .exe en la raíz del zip;
      # package.ps1 lo empaqueta dentro de una carpeta, así que se vuelve a armar sin ella.
      - name: Zip portable con el programa en la raíz
        if: inputs.proyecto != 'launcher'
        shell: pwsh
        working-directory: dist
        run: |
          foreach ($zip in Get-ChildItem -File -Filter *-portable.zip) {
            $tmp = Join-Path $env:RUNNER_TEMP $zip.BaseName
            Expand-Archive -LiteralPath $zip.FullName -DestinationPath $tmp -Force
            $dentro = @(Get-ChildItem -LiteralPath $tmp -Force)
            if ($dentro.Count -eq 1 -and $dentro[0].PSIsContainer) {
              Remove-Item -LiteralPath $zip.FullName
              Compress-Archive -Path (Join-Path $dentro[0].FullName '*') -DestinationPath $zip.FullName -CompressionLevel Optimal
              Write-Output "$($zip.Name): sin la carpeta $($dentro[0].Name)"
            }
            if (-not (Get-ChildItem -LiteralPath $tmp -Recurse -Filter *.exe | Where-Object { $_.Directory.FullName -eq $dentro[0].FullName -or $_.Directory.FullName -eq $tmp })) {
              throw "$($zip.Name) no tiene el .exe de la app"
            }
          }

      # Solo el launcher: el instalador .exe que se descarga desde jacnex.store. Lleva un nombre sin
      # versión para que el enlace releases/latest/download/JacnexStudio-Setup.exe no cambie.
      - name: Instalador .exe (Inno Setup)
        if: inputs.proyecto == 'launcher'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'No se pudo instalar Inno Setup' }
          }
          $version = '${{ steps.version.outputs.version }}'
          $msi = Get-ChildItem dist -Filter *.msi | Select-Object -First 1
          if (-not $msi) { throw 'No hay MSI en dist' }
          & $iscc /Q "/DVersion=$version" "/DMsi=$($msi.FullName)" "/O$env:GITHUB_WORKSPACE\dist" jb\instalador\jacnex-studio.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup falló ($LASTEXITCODE)" }

      - name: Huellas SHA-256
        shell: pwsh
        working-directory: dist
        run: |
          # Formato de sha256sum con saltos de línea LF, como los publica ArtCraft.
          $lineas = Get-ChildItem -File | Where-Object Name -ne 'SHA256SUMS.txt' | Sort-Object Name | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          }
          [IO.File]::WriteAllText((Join-Path (Get-Location) 'SHA256SUMS.txt'), (($lineas -join "`n") + "`n"))
          Get-Content SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.proyecto }}-${{ steps.version.outputs.tag }}-windows-x64
          path: dist/*

      - name: Publicar versión
        if: inputs.publicar
        shell: pwsh
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          $ref = '${{ steps.version.outputs.ref }}'
          $repo = '${{ github.repository }}'
          # actualizar.yml lee "compilado desde <upstream> <ref>" para saber de qué versión de ArtCraft salió.
          $notas = "${{ inputs.nombre }} $tag, compilado desde ${{ inputs.upstream }} $ref con la marca Jacnex. Código y cambios: https://github.com/jacnexstudio/jacnex-build"
          gh release view $tag --repo $repo *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag (Get-ChildItem dist -File).FullName --repo $repo --clobber
          } else {
            gh release create $tag (Get-ChildItem dist -File).FullName --repo $repo --title "${{ inputs.nombre }} $tag" --notes $notas
          }
