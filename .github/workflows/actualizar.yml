# Revisa si ArtCraft publicó una versión nueva de una app y, si la hay, la compila con la marca
# Jacnex y la publica. Lo llaman los repositorios de cada app todos los días (y a mano).

name: Actualizar

on:
  workflow_call:
    inputs:
      proyecto:
        type: string
        required: true
      upstream:
        type: string
        required: true
      nombre:
        type: string
        required: true
      ref:
        description: "Versión original a compilar. Vacío: la última publicada."
        type: string
        default: ""
      publicar:
        type: boolean
        default: true
      forzar:
        description: "Compilar aunque ya esté publicada (ejecución manual)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  revisar:
    runs-on: ubuntu-latest
    outputs:
      compilar: ${{ steps.revisar.outputs.compilar }}
      ref: ${{ steps.revisar.outputs.ref }}
      version: ${{ steps.revisar.outputs.version }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Comparar con la versión original
        id: revisar
        env:
          UPSTREAM: ${{ inputs.upstream }}
          NOMBRE: ${{ inputs.nombre }}
          FORZAR: ${{ inputs.forzar }}
          REF: ${{ inputs.ref }}
        run: |
          original="$REF"
          if [ -z "$original" ]; then
            original=$(gh release view --repo "$UPSTREAM" --json tagName --jq .tagName)
          fi
          datos=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName,body 2>/dev/null || echo '{}')
          publicada=$(jq -r '.tagName // "ninguna"' <<<"$datos")
          # Desde qué versión de ArtCraft se compiló la última: está en las notas de cada versión
          # ("compilado desde storytold/... vX.Y.Z"). Jacnex puede tener un número mayor (ver abajo).
          desde=$(jq -r '.body // ""' <<<"$datos" | grep -oE "compilado desde ${UPSTREAM} v?[0-9][^ ,]*" | head -n 1 | awk '{print $NF}' || true)
          if [ -z "$desde" ]; then desde="$publicada"; fi
          echo "Original: $original · Publicada en Jacnex: $publicada (desde $desde)"
          echo "ref=$original" >> "$GITHUB_OUTPUT"

          # La versión que publica Jacnex. Las actualizaciones y el MSI solo reemplazan un programa
          # por uno con un X.Y.Z mayor: si ArtCraft no tiene una más nueva que la publicada (se
          # vuelve a compilar con cambios de Jacnex), se sube el último número de la publicada.
          o="${original#v}"; p="${publicada#v}"; p="${p%%[-+]*}"
          if [ "$publicada" = "ninguna" ] || { [ "$o" != "$p" ] && [ "$(printf '%s\n%s\n' "$o" "$p" | sort -V | tail -n 1)" = "$o" ]; }; then
            version="$o"
          else
            IFS=. read -r ma mi pa <<<"$p"
            version="$ma.$mi.$((pa + 1))"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

          if [ "$FORZAR" = "true" ] || [ "$original" != "$desde" ]; then
            echo "compilar=true" >> "$GITHUB_OUTPUT"
            echo "### $NOMBRE: se compila $original como v$version (publicada: $publicada, desde $desde)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "compilar=false" >> "$GITHUB_OUTPUT"
            echo "### $NOMBRE: al día ($publicada, desde $desde)" >> "$GITHUB_STEP_SUMMARY"
          fi

  compilar:
    needs: revisar
    if: needs.revisar.outputs.compilar == 'true'
    uses: jacnexstudio/jacnex-build/.github/workflows/compilar-windows.yml@main
    # Las claves de R2 (descargas.jacnex.store) para copiar ahí la versión publicada.
    secrets: inherit
    with:
      proyecto: ${{ inputs.proyecto }}
      upstream: ${{ inputs.upstream }}
      nombre: ${{ inputs.nombre }}
      ref: ${{ needs.revisar.outputs.ref }}
      version: ${{ needs.revisar.outputs.version }}
      publicar: ${{ inputs.publicar }}
